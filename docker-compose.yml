version: '3.8'

services:
  # FastAPI Backend Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-detection-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_SERVER=${DATABASE_SERVER:-MEHTAB_ANSARI\\MSSQL}
      - DATABASE_NAME=${DATABASE_NAME:-FraudDetectionDB}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./src:/app/src
    depends_on:
      - db
    networks:
      - fraud-network
    restart: unless-stopped

  # Streamlit Dashboard Service
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: fraud-detection-dashboard
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_SERVER=${DATABASE_SERVER:-db}
      - DATABASE_NAME=${DATABASE_NAME:-FraudDetectionDB}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - api
    networks:
      - fraud-network
    restart: unless-stopped

  # SQL Server Database
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fraud-detection-db
    environment:
      SA_PASSWORD: "YourStrong@Password123"
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Password123"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fraud-network
    restart: unless-stopped

networks:
  fraud-network:
    driver: bridge

volumes:
  mssql_data:
